version: 2

project_name: gumlet

before:
  hooks:
    - go mod tidy

builds:
  - id: gumlet
    binary: gumlet
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: gumlet
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.NOTARIZE_ISSUER_ID}}"
        key_id: "{{.Env.NOTARIZE_KEY_ID}}"
        key: "{{.Env.NOTARIZE_KEY}}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: gumlet
    name: cli
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"

homebrew_casks:
  - name: gumlet
    repository:
      owner: gumlet
      name: homebrew-tap
      token: "{{ .Env.RELEASE_PUBLISH_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://www.gumlet.com
    description: Gumlet CLI – manage video and image assets from the command line
    license: Apache-2.0

nfpms:
  - id: gumlet
    package_name: gumlet
    ids:
      - gumlet
    vendor: Gumlet Pte. Ltd.
    homepage: https://www.gumlet.com
    maintainer: Gumlet <support@gumlet.com>
    description: Gumlet CLI – manage video and image assets from the command line
    license: Apache-2.0
    formats:
      - deb
      - rpm
    bindir: /usr/bin

scoops:
  - name: gumlet
    homepage: https://www.gumlet.com
    description: Gumlet CLI – manage video and image assets from the command line
    license: Apache-2.0
    skip_upload: '{{ if isEnvSet "RELEASE_PUBLISH_GITHUB_TOKEN" }}auto{{ else }}true{{ end }}'
    repository:
      owner: gumlet
      name: scoop-bucket
      token: "{{ .Env.RELEASE_PUBLISH_GITHUB_TOKEN }}"

winget:
  - name: gumlet
    publisher: Gumlet
    package_identifier: Gumlet.CLI
    package_name: Gumlet CLI
    short_description: Gumlet CLI – manage video and image assets from the command line
    license: Apache-2.0
    license_url: https://github.com/gumlet/cli/blob/main/LICENSE
    homepage: https://www.gumlet.com
    publisher_url: https://www.gumlet.com
    publisher_support_url: https://github.com/gumlet/cli/issues
    copyright: Copyright (c) Gumlet Pte. Ltd.
    release_notes_url: "https://github.com/gumlet/cli/releases/tag/{{ .Tag }}"
    tags:
      - gumlet
      - cli
      - video
      - image
      - cdn
    skip_upload: '{{ if isEnvSet "RELEASE_PUBLISH_GITHUB_TOKEN" }}auto{{ else }}true{{ end }}'
    repository:
      owner: gumlet
      name: winget-pkgs
      branch: "gumlet-{{ .Version }}"
      token: "{{ .Env.RELEASE_PUBLISH_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
