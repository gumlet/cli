name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write # This is required for requesting the JWT
  contents: write

jobs:
  test:
    name: CLI checks
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  goreleaser:
    name: Build & Release
    needs: test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PUBLISH_GITHUB_TOKEN: ${{ secrets.RELEASE_PUBLISH_GITHUB_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          NOTARIZE_ISSUER_ID: ${{ secrets.NOTARIZE_ISSUER_ID }}
          NOTARIZE_KEY_ID: ${{ secrets.NOTARIZE_KEY_ID }}
          NOTARIZE_KEY: ${{ secrets.NOTARIZE_KEY }}

  npm-publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    needs: goreleaser
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: "https://registry.npmjs.org"

      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          npm --prefix npm version $VERSION --no-git-tag-version

      - name: Publish to npm
        run: npm publish
        working-directory: npm
